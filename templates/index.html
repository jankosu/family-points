<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rodzinne Punkty</title>
<meta name="csrf-token" content="{{ session.csrf }}">
<script src="{{ url_for('static', filename='theme.js', v='2') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='2') }}">
</head>
<body>
<header>
  <h1>⭐ Rodzinne Punkty</h1>
  <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">🌙 Ciemny motyw</button>
</header>

<div class="bar">
  <label>Data: <input id="day" type="date"></label>
  <button onclick="load()">Pokaż dzień</button>
  <form method="post" action="{{ url_for('logout') }}" style="display:inline">
    <input type="hidden" name="csrf_token" value="{{ session.csrf }}">
    <button type="submit">Wyloguj ({{ session.user }})</button>
  </form>
</div>

<main>
  <div id="msg" class="msg"></div>
  <section id="children" class="children"></section>

  <h2>🎁 Wishlisty</h2>
  <section id="rewards" class="rewardlist"></section>

  <div class="admin">
    <button onclick="document.querySelector('.adminbox').style.display='block'">Panel rodzica</button>
    <div class="adminbox">
      <b>Dodaj nagrodę</b><br>
      <input id="rtitle" placeholder="Nazwa">
      <input id="rcost" type="number" placeholder="Punkty"><br>
      <input id="pin" type="password" placeholder="PIN rodzica"><br>
      <button onclick="addReward()">Dodaj</button>
      <hr>
      <b>Historia punktów</b><br>
      <select id="hchild">
        {% for child in kids %}
        <option value="{{ child.id }}">{{ child.name }}</option>
        {% endfor %}
      </select>
      <button onclick="showHistory()">Pokaż historię</button>
      <div id="history"></div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
