<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logowanie — Rodzinne Punkty</title>
<script src="{{ url_for('static', filename='theme.js', v='2') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='2') }}">
<style>.login-card{max-width:380px;margin:48px auto;padding:24px;background:var(--surface);border-radius:18px}.login-card label{display:block;margin:16px 0}.login-card input{display:block;box-sizing:border-box;width:100%;margin-top:6px}.login-card button{width:100%}.login-error{color:var(--error)}</style>
</head>
<body>
<header><h1>⭐ Rodzinne Punkty</h1><button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">🌙 Ciemny motyw</button></header>
<main><section class="login-card">
<h2>Zaloguj się</h2>
{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf_token" value="{{ session.csrf }}">
<label>Login <input name="username" autocomplete="username" required autofocus maxlength="100"></label>
<label>Hasło <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<button type="submit">Zaloguj</button>
</form>
</section></main>
</body>
</html>
